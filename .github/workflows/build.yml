name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build solve
        run: g++ -std=c++20 -O2 -Wall -Wextra src/Solve.cpp -o solve

      - name: Build generate
        run: g++ -std=c++20 -O2 -Wall -Wextra src/Generate.cpp -o generate

      - name: Install MinGW-w64 (Windows cross-compiler)
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Build solve.exe (Windows)
        run: x86_64-w64-mingw32-g++ -std=c++20 -O2 -Wall -Wextra -static src/Solve.cpp -o solve.exe

      - name: Build generate.exe (Windows)
        run: x86_64-w64-mingw32-g++ -std=c++20 -O2 -Wall -Wextra -static src/Generate.cpp -o generate.exe

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            solve.exe
            generate.exe
