name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pch.h is a Visual Studio precompiled-header stub; it is
      # intentionally gitignored (see .gitignore) and normally
      # generated by Visual Studio itself.
      - name: Create pch.h stub
        run: echo '#pragma once' > src/pch.h

      - name: Build
        run: g++ -std=c++17 -O2 -Wall -Wextra src/Sudoku.cpp -o sudoku
