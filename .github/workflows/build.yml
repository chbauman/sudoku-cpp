name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build solve
        run: g++ -std=c++17 -O2 -Wall -Wextra src/Solve.cpp -o solve

      - name: Build generate
        run: g++ -std=c++17 -O2 -Wall -Wextra src/Generate.cpp -o generate
